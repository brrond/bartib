[package]
name = "bartib"
version = "2.0.0"
authors = ["Nikolas Schmidt-Voigt <nikolas.schmidt-voigt@posteo.de>", "Daniil Onishchenko <danya17072@pm.me>"]
edition = "2018"
description = "A simple timetracker for the command line"
readme = "README.md"
homepage = "https://github.com/brrond/bartib"
repository = "https://github.com/brrond/bartib"
license = "GPL-3.0-or-later"
keywords = ["cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = "2.34.0"
nu-ansi-term = "0.50.3"
term_size = "0.3.2"
textwrap = "0.16.4"
thiserror = "2.0.21"
wildmatch = "2.7.0"
reqwest = { version = "0.13.5", features = ["blocking"] }

[features]
# Timestamps are recorded with second precision instead of the default minute precision
second-precision = []
